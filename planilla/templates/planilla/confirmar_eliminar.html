{% extends "base.html" %}

{% block title %}Eliminar Registro — Sysaco{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-danger">
            <div class="card-header bg-danger text-white"><h4 class="mb-0">Confirmar Eliminación</h4></div>
            <div class="card-body text-center py-4">
                <p class="fs-5">¿Eliminar el registro de planilla?</p>
                <p class="fw-bold fs-4">{{ registro }}</p>
                <form method="post" class="d-flex justify-content-center gap-3 mt-3">
                    {% csrf_token %}
                    <a href="{% url 'planilla:lista' %}" class="btn btn-secondary px-4">Cancelar</a>
                    <button type="submit" class="btn btn-danger px-4">Sí, eliminar</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
