name: SYSACO CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-test:
    name: Lint + Test (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código fuente
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar linter flake8
        run: |
          flake8 . --count --max-line-length=100 --statistics
        continue-on-error: false

      - name: Ejecutar pruebas con pytest
        env:
          DJANGO_SETTINGS_MODULE: sysaco.settings_test
          SECRET_KEY: ci-test-secret-key-not-for-production
          DEBUG: "True"
        run: |
          pytest --cov=. --cov-report=term-missing -v

      - name: Mostrar resumen de cobertura
        if: always()
        run: |
          echo "Pipeline finalizado. Revisa los resultados arriba."
